name: express_pickup
description: 快递取件协作 App (Flutter)
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # 状态管理
  provider: ^6.1.2
  # 网络
  dio: ^5.7.0
  # 本地存储 token
  shared_preferences: ^2.3.2
  # 通知 + 真实推送（FCM，Android/iOS 通用）
  flutter_local_notifications: ^17.2.3
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  # 截图 OCR（本地，离线）
  google_mlkit_text_recognition: ^0.13.0
  image_picker: ^1.1.2
  # 读取剪贴板已内置于 flutter/services
  # 后台定时任务：扫短信自动记录 + 拉取通知（国内不依赖谷歌服务，App 关闭也能跑）
  # 注：0.5.x 用的是已被删除的 Flutter v1 embedding，无法在 Flutter 3.x 编译，必须用 0.7+。
  workmanager: ^0.9.0
  # 读取短信（仅 Android；iOS 系统禁止 App 读短信）
  another_telephony: ^0.4.1
  # 运行时权限（短信 / 通知）
  permission_handler: ^11.3.1
  # 前台常驻服务：国产手机划掉 App 也能保活轮询收通知（通知栏挂一条常驻通知）
  flutter_foreground_task: ^8.17.0
  # 打开外部链接（管理员跳转 Web 后台 / 下载新版）
  url_launcher: ^6.3.0
  # 读取当前 App 版本号（用于检查 GitHub 新版本）
  package_info_plus: ^8.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # 一键生成各尺寸启动图标
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

# App 启动图标生成配置：把源图放到 assets/icon/app_icon.png 后运行
#   flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false # 本项目暂不打 iOS，且无完整 iOS 工程目录
  image_path: "assets/icon/app_icon.png"
  # 自适应图标（Android 8+）：蓝底 + 前景图，避免被裁切
  adaptive_icon_background: "#3A7AFE"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
